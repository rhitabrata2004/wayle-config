# Wayle configuration file

# Solid bar background instead of transparent, so modules sit inside one
# continuous bar rather than floating as separate pills over the wallpaper.
# button-variant "basic" + zero button-bg-opacity drops the per-module
# bubble backgrounds; bold + slightly larger labels keep text legible
# against the bar without them.
[bar]
bg = "bg-surface"
# Matches kitty's background_opacity (0.6) for a consistent see-through look.
background-opacity = 60
rounding = "none"
button-variant = "basic"
button-bg-opacity = 0
button-label-weight = "bold"
button-label-size = 1.1
# The shared group containers (center, status) default to their own
# bg-elevated bubble too -- kill that so grouped modules sit flush on
# the bar background instead of a second nested chip.
button-group-background = "transparent"
button-group-opacity = 0

[[bar.layout]]
monitor = "*"
left = ["custom-applications", "media"]
# Grouped so clock+cava and the status icons each render as a single
# container instead of a string of individually-spaced floating buttons.
center = [{ name = "center", modules = ["clock", "cava"] }]
right = [
    { name = "status", modules = [
        "custom-weather-auto",
        "custom-theme-switcher",
        "battery",
        "bluetooth",
        "network",
        "volume",
        "systray",
    ] }
]

[[modules.custom]]
id = "weather-auto"
command = "$HOME/.local/bin/wayle-weather-auto"
interval-ms = 900000
icon-name = "ld-cloud-symbolic"
icon-map = { "clear" = "ld-sun-symbolic", "clear-night" = "ld-moon-symbolic", "partly" = "ld-cloud-sun-symbolic", "cloudy" = "ld-cloud-symbolic", "fog" = "ld-cloud-fog-symbolic", "drizzle" = "ld-cloud-drizzle-symbolic", "rain" = "ld-cloud-rain-symbolic", "snow" = "ld-cloud-snow-symbolic", "storm" = "ld-cloud-lightning-symbolic" }
label-show = true

[[modules.custom]]
id = "applications"
icon-name = "si-archlinux-symbolic"
label-show = false
left-click = "~/.config/hypr/scripts/toggle-kando.sh"

[[modules.custom]]
id = "theme-switcher"
command = "cat ~/.config/wayle/current-theme 2>/dev/null || echo catppuccin"
interval-ms = 1000

left-click = "$HOME/.local/bin/wayle-theme next"
right-click = "$HOME/.local/bin/wayle-theme prev"

icon-name = "ld-palette-symbolic"
label-show = true
format = "{{ output }}"
