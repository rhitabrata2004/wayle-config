# Wayle configuration file

# Solid bar background instead of transparent, so modules sit inside one
# continuous bar rather than floating as separate pills over the wallpaper.
[bar]
bg = "bg-surface"

[[bar.layout]]
monitor = "*"
left = ["media"]
# Grouped so clock+cava and the status icons each render as a single
# container instead of a string of individually-spaced floating buttons.
center = [{ name = "center", modules = ["clock", "cava"] }]
right = [
    { name = "status", modules = [
        "custom-theme-switcher",
        "battery",
        "bluetooth",
        "network",
        "volume",
        "systray",
    ] }
]

[[modules.custom]]
id = "theme-switcher"
command = "cat ~/.config/wayle/current-theme 2>/dev/null || echo catppuccin"
interval-ms = 1000

left-click = "$HOME/.local/bin/wayle-theme next"
right-click = "$HOME/.local/bin/wayle-theme prev"

icon-name = "ld-palette-symbolic"
label-show = true
format = "{{ output }}"
